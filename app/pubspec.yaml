name: esp_micro
description: "Dadou — télécommande du PC, app de l'ESP32 Maison (projet Micro)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icône de l'app (dart run flutter_launcher_icons) — images créées par tools/assets/generer_icone.py
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone.png"
  adaptive_icon_background: "assets/icone/icone_fond.png"
  adaptive_icon_foreground: "assets/icone/icone_avant.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Polices Inter : SIL Open Font License 1.1 (voir assets/fonts/LICENCE_POLICES.txt)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-Black.otf
          weight: 900
